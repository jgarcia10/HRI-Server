robot: {backend: ur, ip: 147.250.35.40, calibration: hub/kit_study/configs/calibration.yaml, gripper_settle_s: 6.5, gripper_open_settle_s: 1.5, allow_example_calibration: false,
        gripper: {kind: tool_do, do: 0, close_high: true},
        speeds: {slow:   {joint_v: 0.30, joint_a: 0.50, lin_v: 0.08, lin_a: 0.30},
                 normal: {joint_v: 0.60, joint_a: 0.80, lin_v: 0.15, lin_a: 0.50},
                 fast:   {joint_v: 1.10, joint_a: 1.50, lin_v: 0.30, lin_a: 0.90}}}
        # `speeds` is the arm, per pace level — the wizard's "Robot speed" switch picks one
        # live. joint_v is rad/s (the UR5's own ceiling is 3.14) and lin_v m/s. This is the
        # only speed that can actually be tuned: the RG2's jaws run at a fixed rate set in
        # the gripper's own firmware, so `gripper_settle_s` below is a *waiting* time, not a
        # speed. Raise a level only after watching a full supply cycle at it.
        #
        # gripper_settle_s 6.5 = how long the jaws are given to close. They always rest fully
        # open (~110 mm) because DO0 = 0 is held between cycles, so every grasp travels most
        # of the ~7-9 s full stroke to reach a 32 mm brick. Do not trim it without re-testing
        # every depot slot: a short close is a dropped brick mid-carry.
        # gripper_open_settle_s 1.5 = release only has to free the brick, a few millimetres;
        # the jaws keep travelling to fully open during the retreat and the transit move.
        # Lab RG2 v2 (measured 2026-09-11): a SINGLE-LINE level-driven gripper on tool DO0.
        #   1. DO0 is the only control line: DO0 = 1 drives CLOSED, DO0 = 0 drives OPEN. It
        #      travels continuously while the level is applied — full stroke takes ~7 s.
        #      Resting at DO0 = 0 (open) is the safe idle state.
        #   2. Tool DO1 must NEVER be written — asserting it is what latched the gripper fault
        #      all day on 2026-09-10. `ToolDOGripper` forces it low exactly once, at connect().
        #   3. Closing fully on air (nothing between the fingers) presses the fingertip safety
        #      switches and latches a fault; closing onto a brick is fine. Recovery is the
        #      wizard's "Reset gripper" button (`URBackend.reset_gripper` — a tool-voltage power
        #      cycle plus a wake pulse, ~30 s; see RUNBOOK_robot.md §C.3).
        # kind: dual_do must NOT be used on this robot — its `open_do` line is tool DO1, and
        # writing it faults the gripper.
        # kind: onrobot_modbus — direct Modbus TCP to the box, bypasses the URCap:
        # gripper: {kind: onrobot_modbus, ip: 192.168.1.1, port: 502, unit_id: 65,
        #           force_n: 20.0, open_width_mm: 100.0, close_width_mm: 25.0, settle_s: 1.0}
        # kind: onrobot_urcap — drive rg_grip(...) through the OnRobot URCap itself (needs it
        #           installed and connected on the pendant); talks to the UR (robot.ip above),
        #           not a separate box, so `ip` here is optional:
        # gripper: {kind: onrobot_urcap, force_n: 20.0, open_width_mm: 100.0,
        #           close_width_mm: 20.0, timeout_s: 15.0}
supply: {lookahead: 1, side: C, pace: normal, announce: false}
